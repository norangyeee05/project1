<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='회원 상세')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<main class="container" style="max-width: 560px;">
    <h2 class="mb-4">회원 상세</h2>

    <div class="card mb-4">
        <div class="card-body">
            <table class="table table-borderless mb-0">
                <tbody>
                <tr>
                    <th style="width: 30%;">ID</th>
                    <td th:text="${member.id}">1</td>
                </tr>
                <tr>
                    <th>아이디</th>
                    <td th:text="${member.loginId}">loginId</td>
                </tr>
                <tr>
                    <th>이름</th>
                    <td th:text="${member.name}">이름</td>
                </tr>
                <tr>
                    <th>이메일</th>
                    <td th:text="${member.email}">email</td>
                </tr>
                <tr>
                    <th>전화번호</th>
                    <td th:text="${member.phone} ?: '-'">phone</td>
                </tr>
                <tr>
                    <th>등급</th>
                    <td><span class="badge bg-secondary" th:text="${member.role}">USER</span></td>
                </tr>
                <tr>
                    <th>상태</th>
                    <td>
                        <span class="badge"
                              th:classappend="${member.status.name() == 'ACTIVE'} ? 'bg-success' : (${member.status.name() == 'INACTIVE'} ? 'bg-secondary' : 'bg-danger')"
                              th:text="${member.status}">ACTIVE</span>
                    </td>
                </tr>
                <tr>
                    <th>가입일</th>
                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex gap-2 flex-wrap">
        <form th:if="${member.status.name() == 'ACTIVE'}"
              th:action="@{/admin/members/{id}/deactivate(id=${member.id})}" method="post">
            <button type="submit" class="btn btn-outline-secondary">비활성화</button>
        </form>
        <form th:if="${member.status.name() != 'ACTIVE'}"
              th:action="@{/admin/members/{id}/activate(id=${member.id})}" method="post">
            <button type="submit" class="btn btn-outline-success">활성화</button>
        </form>
        <form th:action="@{/admin/members/{id}/kick(id=${member.id})}" method="post"
              onsubmit="return confirm('정말 강퇴하시겠습니까?');">
            <button type="submit" class="btn btn-outline-danger">강퇴</button>
        </form>
        <a class="btn btn-outline-secondary ms-auto" th:href="@{/admin/members}">목록으로</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
