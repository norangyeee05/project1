<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='회원 관리')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<main class="container">
    <h2 class="mb-4">회원 관리</h2>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>등급</th>
                <th>상태</th>
                <th>가입일</th>
                <th class="text-end">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.id}">1</td>
                <td th:text="${member.loginId}">loginId</td>
                <td>
                    <a th:href="@{/admin/members/{id}(id=${member.id})}" th:text="${member.name}">이름</a>
                </td>
                <td th:text="${member.email}">email</td>
                <td th:text="${member.phone} ?: '-'">phone</td>
                <td th:text="${member.role}">USER</td>
                <td>
                    <span class="badge"
                          th:classappend="${member.status.name() == 'ACTIVE'} ? 'bg-success' : (${member.status.name() == 'INACTIVE'} ? 'bg-secondary' : 'bg-danger')"
                          th:text="${member.status}">ACTIVE</span>
                </td>
                <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                <td class="text-end">
                    <div class="d-flex gap-1 justify-content-end flex-wrap">
                        <form th:if="${member.status.name() == 'ACTIVE'}"
                              th:action="@{/admin/members/{id}/deactivate(id=${member.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">비활성화</button>
                        </form>
                        <form th:if="${member.status.name() != 'ACTIVE'}"
                              th:action="@{/admin/members/{id}/activate(id=${member.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-success">활성화</button>
                        </form>
                        <form th:action="@{/admin/members/{id}/kick(id=${member.id})}" method="post"
                              onsubmit="return confirm('정말 강퇴하시겠습니까?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">강퇴</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="9" class="text-center text-muted py-4">등록된 회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
