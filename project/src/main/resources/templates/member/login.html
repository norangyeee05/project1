<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='로그인')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<main class="container" style="max-width: 420px;">
    <h2 class="mb-4 text-center">로그인</h2>

    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">
        오류 메시지
    </div>

    <form th:action="@{/members/login}" method="post">
        <div class="mb-3">
            <label for="loginId" class="form-label">아이디</label>
            <input type="text" class="form-control" id="loginId" name="loginId" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/members/terms}" class="text-decoration-none">아직 계정이 없으신가요? 회원가입</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
