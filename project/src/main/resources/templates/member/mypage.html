<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='마이페이지')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<main class="container" style="max-width: 560px;">
    <h2 class="mb-4">마이페이지</h2>

    <div class="card">
        <div class="card-body">
            <table class="table table-borderless mb-0">
                <tbody>
                <tr>
                    <th style="width: 30%;">아이디</th>
                    <td th:text="${member.loginId}">loginId</td>
                </tr>
                <tr>
                    <th>이름</th>
                    <td th:text="${member.name}">이름</td>
                </tr>
                <tr>
                    <th>이메일</th>
                    <td th:text="${member.email}">email</td>
                </tr>
                <tr>
                    <th>전화번호</th>
                    <td th:text="${member.phone} ?: '-'">phone</td>
                </tr>
                <tr>
                    <th>등급</th>
                    <td><span class="badge bg-secondary" th:text="${member.role}">USER</span></td>
                </tr>
                <tr>
                    <th>상태</th>
                    <td><span class="badge bg-success" th:text="${member.status}">ACTIVE</span></td>
                </tr>
                <tr>
                    <th>가입일</th>
                    <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex gap-2 mt-4">
        <a class="btn btn-primary" th:href="@{/members/edit}">정보 수정</a>
        <a class="btn btn-outline-danger" th:href="@{/members/delete}">회원 탈퇴</a>
        <a class="btn btn-outline-secondary ms-auto" th:href="@{/members/logout}">로그아웃</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
