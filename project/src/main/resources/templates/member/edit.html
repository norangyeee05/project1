<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='회원정보 수정')}"></head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<main class="container" style="max-width: 480px;">
    <h2 class="mb-4 text-center">회원정보 수정</h2>

    <form th:action="@{/members/edit}" th:object="${member}" method="post">
        <div class="mb-3">
            <label class="form-label">아이디</label>
            <input type="text" class="form-control" th:value="${member.loginId}" disabled>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${member.name}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${member.email}" required>
        </div>
        <div class="mb-4">
            <label for="phone" class="form-label">전화번호</label>
            <input type="text" class="form-control" id="phone" name="phone" th:value="${member.phone}"
                   placeholder="010-0000-0000">
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">저장</button>
            <a class="btn btn-outline-secondary flex-fill" th:href="@{/members/mypage}">취소</a>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
